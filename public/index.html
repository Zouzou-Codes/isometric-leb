<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isometric London</title>
<meta name="description" content="A giant isometric pixel-art map of central London, drawn entirely in code from OpenStreetMap data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen canvas; a few pixel-style panels pinned to the corners like a city-builder HUD. */
:root{
  color-scheme: light;
  --sky:#a9c3c9;          /* page ground outside the map */
  --panel:#f4efe3;        /* HUD panels: Portland stone */
  --ink:#2a2622;          /* text */
  --muted:#6e675c;
  --edge:#2a2622;         /* 2px pixel borders */
  --accent:#c8102e;       /* London bus red */
  --accent-ink:#ffffff;
  --pixel:"Silkscreen", "Courier New", monospace;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
:root.night{ --sky:#0e1424; --panel:#1b2236; --ink:#efe6cf; --muted:#9a95a8; --edge:#000; --accent:#ffb43a; --accent-ink:#1b1408; color-scheme: dark; }
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--mono);font-size:13px;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;image-rendering:pixelated}
canvas.drag{cursor:grabbing}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:2px solid var(--edge);box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.title{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 16px);padding:10px 14px;max-width:calc(100% - 32px);box-sizing:border-box}
.title h1{font-family:var(--pixel);font-weight:700;font-size:22px;margin:0;letter-spacing:.02em;line-height:1}
.title p{margin:6px 0 0;color:var(--muted);font-size:11px}
.search{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);width:min(300px,calc(100% - 32px))}
.search input{width:100%;box-sizing:border-box;border:0;background:none;padding:10px 12px;font-size:13px;outline:none}
.search ul{list-style:none;margin:0;padding:0;border-top:2px solid var(--edge);max-height:40vh;overflow:auto}
.search li button{width:100%;text-align:left;background:none;border:0;padding:7px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.search li button:hover,.search li button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.search li small{opacity:.7}
.tools{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:8px}
.tools button{width:44px;height:44px;border:2px solid var(--edge);background:var(--panel);font-family:var(--pixel);font-size:16px;cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.25);display:grid;place-items:center}
.tools button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.25)}
.tools button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.marks{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-wrap:wrap;gap:6px;max-width:min(640px,calc(100% - 100px))}
.marks button{border:2px solid var(--edge);background:var(--panel);padding:4px 8px;font-size:11px;cursor:pointer;box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.marks button:hover{background:var(--accent);color:var(--accent-ink)}
.marks button.whale{background:#2f4f72;color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;padding:6px 16px calc(env(safe-area-inset-bottom,0px) + 6px);font-size:10px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:linear-gradient(transparent,var(--sky) 60%)}
.foot a{color:inherit}
.status{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 20px);transform:translateX(-50%);padding:6px 12px;font-family:var(--pixel);font-size:12px}
.err{position:fixed;inset:0;display:grid;place-items:center;padding:16px}
.err div{max-width:460px;padding:18px 20px;line-height:1.55}
.err code{background:rgba(0,0,0,.08);padding:1px 4px}
@media (max-width:640px){
  .title h1{font-size:17px}.title p{display:none}
  .search{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 58px);right:76px;width:auto;left:16px}
  .tools{bottom:calc(env(safe-area-inset-bottom,0px) + 58px)}
  .search ul{position:absolute;bottom:100%;left:-2px;right:-2px;background:var(--panel);border:2px solid var(--edge)}
  .marks{display:none}
  .status{top:70px}
}
</style>
</head>
<body>
<canvas id="map" aria-label="Isometric pixel-art map of central London. Drag to move, scroll to zoom."></canvas>

<header class="title panel"><h1>Isometric London</h1><p>Every building drawn in code from OpenStreetMap</p></header>

<div class="search panel" role="search">
  <input id="q" type="search" placeholder="Search a place…" autocomplete="off" aria-label="Search a place">
  <ul id="results" hidden></ul>
</div>

<div class="marks" id="marks" aria-label="Landmarks"></div>

<div class="tools">
  <button id="zin" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
  <button id="zout" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
  <button id="rot" type="button" aria-label="Rotate view" title="Rotate (R)">⟳</button>
  <button id="night" type="button" aria-label="Night mode" aria-pressed="false" title="Day / night (N)">☾</button>
</div>

<div class="status panel" id="status" hidden></div>

<footer class="foot">
  <span>Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL) · built <span id="built"></span></span>
  <span>Inspired by <a href="https://cannoneyed.com/isometric-nyc/" target="_blank" rel="noopener">isometric.nyc</a> · <a href="https://github.com/arikhanacademic-cpu/isometric-london" target="_blank" rel="noopener">source on GitHub</a> · by Ari Khan</span>
</footer>

<div class="err" id="err" hidden><div class="panel"></div></div>

<script src="landmarks.js"></script>
<script src="iso.js"></script>
</body>
</html>
